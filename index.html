<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Board - Live Teaching App with 3D Shapes</title>
    <!-- Three.js for 3D Shapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #board-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #111;
            cursor: crosshair;
        }

        /* Background styles */
        .bg-dark { background: #111; }
        .bg-white { background: #ffffff; }
        .bg-green { background: #0f381e; }
        .bg-grid {
            background-color: #111;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-lined {
            background-color: #111;
            background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 100% 30px;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
        }

        #canvas-3d {
            pointer-events: none; /* Let clicks pass through unless interacting with 3D */
            z-index: 10;
        }
        #whiteboard {
            z-index: 5;
        }

        /* Toolbar UI */
        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 10px;
        }

        button, select {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        button:hover, select:hover { background: #3a3a3a; }
        button.active { background: #00adb5; border-color: #00adb5; font-weight: bold; }

        .preset-color {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="board-container" class="bg-dark">
        <!-- 2D Drawing Canvas -->
        <canvas id="whiteboard"></canvas>
        <!-- 3D Three.js Canvas -->
        <canvas id="canvas-3d"></canvas>
    </div>

    <div id="toolbar">
        <!-- Tools Mode -->
        <div class="tool-group">
            <button id="btn-pen" class="active" onclick="setMode('pen')">🖊️ Pen</button>
            <button id="btn-highlighter" onclick="setMode('highlighter')">🖍️ Highlight</button>
            <button id="btn-eraser" onclick="setMode('eraser')">🧹 Eraser</button>
        </div>

        <!-- Colors -->
        <div class="tool-group">
            <div class="preset-color" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
            <div class="preset-color" style="background: #00adb5;" onclick="setColor('#00adb5')"></div>
            <div class="preset-color" style="background: #ff5722;" onclick="setColor('#ff5722')"></div>
            <div class="preset-color" style="background: #ffeb3b;" onclick="setColor('#ffeb3b')"></div>
            <div class="preset-color" style="background: #4caf50;" onclick="setColor('#4caf50')"></div>
        </div>

        <!-- 2D Shapes -->
        <div class="tool-group">
            <button onclick="setShape('free')" id="shape-free" class="active">Free</button>
            <button onclick="setShape('line')" id="shape-line">Line</button>
            <button onclick="setShape('rect')" id="shape-rect">Rect</button>
            <button onclick="setShape('circle')" id="shape-circle">Circle</button>
            <button onclick="setShape('arrow')" id="shape-arrow">Arrow</button>
        </div>

        <!-- 3D Shapes (New Feature) -->
        <div class="tool-group">
            <button onclick="spawn3D('cube')">🧊 Cube</button>
            <button onclick="spawn3D('sphere')">⚽ Sphere</button>
            <button onclick="spawn3D('cylinder')">🥫 Cylinder</button>
            <button onclick="clear3D()" style="background: #c9302c;">Clear 3D</button>
        </div>

        <!-- Backgrounds -->
        <div class="tool-group">
            <select id="bg-selector" onchange="changeBackground(this.value)">
                <option value="bg-dark">Dark BG</option>
                <option value="bg-white">White BG</option>
                <option value="bg-green">Chalkboard</option>
                <option value="bg-grid">Grid / Graph</option>
                <option value="bg-lined">Lined Notes</option>
            </select>
        </div>

        <!-- Actions -->
        <div class="tool-group" style="border: none;">
            <button onclick="clearCanvas()" style="background: #d9534f; border-color: #d9534f;">Clear 2D</button>
            <button onclick="saveCanvas()" style="background: #5cb85c; border-color: #5cb85c;">Save</button>
        </div>
    </div>

    <script>
        // --- 2D WHITEBOARD LOGIC ---
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('board-container');

        let painting = false;
        let mode = 'pen'; 
        let currentColor = '#ffffff';
        let currentSize = 3;
        let currentShape = 'free';
        let startX, startY;
        let snapshot;

        function resizeCanvas() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.putImageData(imgData, 0, 0);

            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('#toolbar button').forEach(b => {
                if(b.id.startsWith('btn-')) b.classList.remove('active');
            });
            document.getElementById('btn-' + mode).classList.add('active');
            
            if(mode === 'highlighter') currentSize = 20;
            else if(mode === 'pen') currentSize = 3;
            else if(mode === 'eraser') currentSize = 25;
        }

        function setColor(color) { currentColor = color; }

        function setShape(shape) {
            currentShape = shape;
            document.querySelectorAll('.tool-group button').forEach(b => {
                if(b.id.startsWith('shape-')) b.classList.remove('active');
            });
            document.getElementById('shape-' + shape).classList.add('active');
        }

        function changeBackground(bgClass) {
            container.className = '';
            container.classList.add(bgClass);
        }

        function startPosition(e) {
            if (e.target.id === 'canvas-3d') return; // Don't draw if interacting with 3D
            painting = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX || e.touches[0].clientX;
            startY = e.clientY || e.touches[0].clientY;
            
            ctx.beginPath();
            ctx.moveTo(startX - rect.left, startY - rect.top);
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            if (currentShape !== 'free' && mode !== 'eraser') {
                ctx.putImageData(snapshot, 0, 0);
                drawShape(x, y);
                return;
            }

            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (mode === 'eraser') {
                ctx.strokeStyle = container.classList.contains('bg-white') ? '#ffffff' : (container.classList.contains('bg-green') ? '#0f381e' : '#111111');
                ctx.globalAlpha = 1.0;
            } else if (mode === 'highlighter') {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 0.3;
            } else {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 1.0;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function drawShape(x, y) {
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.globalAlpha = (mode === 'highlighter') ? 0.3 : 1.0;

            let sx = startX - canvas.getBoundingClientRect().left;
            let sy = startY - canvas.getBoundingClientRect().top;

            if (currentShape === 'line') {
                ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(x, y); ctx.stroke();
            } else if (currentShape === 'rect') {
                ctx.strokeRect(sx, sy, x - sx, y - sy);
            } else if (currentShape === 'circle') {
                let radius = Math.sqrt(Math.pow(x - sx, 2) + Math.pow(y - sy, 2));
                ctx.beginPath(); ctx.arc(sx, sy, radius, 0, 2 * Math.PI); ctx.stroke();
            }
        }

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function saveCanvas() {
            const link = document.createElement('a');
            link.download = 'sks-board-notes.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);


        // --- 3D THREE.JS LOGIC ---
        let scene, camera, renderer, currentMesh;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            camera.position.z = 5;
            animate3D();
        }

        function spawn3D(type) {
            if (currentMesh) scene.remove(currentMesh);

            let geometry;
            if (type === 'cube') geometry = new THREE.BoxGeometry(2, 2, 2);
            else if (type === 'sphere') geometry = new THREE.SphereGeometry(1.5, 32, 32);
            else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(1, 1, 3, 32);

            // Wireframe + Solid material for teaching look
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00adb5, 
                roughness: 0.3, 
                metalness: 0.2,
                wireframe: false 
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function clear3D() {
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh = null;
            }
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (currentMesh) {
                currentMesh.rotation.x += 0.01;
                currentMesh.rotation.y += 0.015;
            }
            renderer.render(scene, camera);
        }

        init3D();
    </script>
</body>
</html>
