<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Board - Ultimate Teaching App</title>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0f381e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #board-container { position: relative; width: 100vw; height: 100vh; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; pointer-events: none; }
        #whiteboard { z-index: 5; pointer-events: auto; }
        #laser-canvas { z-index: 7; }
        #canvas-3d { z-index: 10; }
        #canvas-3d.interactive { pointer-events: auto; }

        #webcam-container {
            position: absolute; top: 20px; right: 20px; width: 200px; height: 150px;
            background: #000; border: 2px solid #00adb5; border-radius: 8px;
            overflow: hidden; display: none; z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }

        /* Smart Board Style Compact Floating Toolbar */
        #toolbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px);
            padding: 6px 10px; border-radius: 12px; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); z-index: 300;
            cursor: move; touch-action: none; border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap; max-width: 98vw;
        }

        .tool-group { display: flex; align-items: center; gap: 4px; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 6px; cursor: default; }
        .tool-group:last-child { border-right: none; }

        button, select, label {
            background: #2a2a2a; color: white; border: 1px solid #444; padding: 6px 9px;
            border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        button:hover, select:hover, label:hover { background: #3a3a3a; }
        button.active { background: #00adb5; border-color: #00adb5; font-weight: bold; }

        .preset-color { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; display: inline-block; }
        input[type="range"] { width: 70px; accent-color: #00adb5; vertical-align: middle; }

        /* More Menu Popup Modal */
        #more-menu {
            position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            padding: 12px; display: none; flex-direction: column; gap: 10px;
            z-index: 350; box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-width: 95vw;
        }
        .menu-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .menu-row:last-child { border-bottom: none; padding-bottom: 0; }
    </style>
</head>
<body>

    <div id="board-container" style="background: #0f381e;">
        <canvas id="whiteboard"></canvas>
        <canvas id="laser-canvas"></canvas>
        <canvas id="canvas-3d"></canvas>
    </div>

    <div id="webcam-container"><video id="webcam-video" autoplay playsinline></video></div>

    <!-- Smart Board Compact Toolbar -->
    <div id="toolbar">
        <div class="tool-group">
            <button id="mode-draw" class="active" onclick="setInteraction('draw')">✍️</button>
            <button id="mode-3d" onclick="setInteraction('3d')">🧊</button>
        </div>

        <div class="tool-group">
            <button id="btn-pen" class="active" onclick="setMode('pen')">🖊️</button>
            <button id="btn-highlighter" onclick="setMode('highlighter')">🖍️</button>
            <button id="btn-laser" onclick="setMode('laser')">🔦 Laser</button>
            <button id="btn-eraser" onclick="setMode('eraser')">🧹</button>
        </div>

        <div class="tool-group">
            <button onclick="undoCanvas()" title="Undo">↩️</button>
            <button onclick="redoCanvas()" title="Redo">↪️</button>
            <button onclick="clearCanvas()" style="background: #d9534f;" title="Clear">🗑️</button>
        </div>

        <div class="tool-group" style="border: none;">
            <button id="btn-more" onclick="toggleMoreMenu()" style="background: #00adb5; font-weight: bold;">⚙️ More</button>
        </div>
    </div>

    <!-- More Tools Popup Menu -->
    <div id="more-menu">
        <!-- Row 1: Brush Size & Global Color Presets -->
        <div class="menu-row">
            <label style="font-size: 11px;">Size:</label>
            <input type="range" id="pen-size" min="1" max="50" value="5" oninput="setBrushSize(this.value)">
            <span id="size-val" style="color: #fff; font-size: 11px; width: 20px;">5</span>
            <div class="preset-color" style="background: #00adb5;" onclick="setColor('#00adb5')"></div>
            <div class="preset-color" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
            <div class="preset-color" style="background: #ff5722;" onclick="setColor('#ff5722')"></div>
            <div class="preset-color" style="background: #ffeb3b;" onclick="setColor('#ffeb3b')"></div>
            <div class="preset-color" style="background: #4caf50;" onclick="setColor('#4caf50')"></div>
        </div>

        <!-- Row 2: 2D Shapes -->
        <div class="menu-row">
            <span style="color:#aaa; font-size:11px;">Shapes:</span>
            <button onclick="setShape('free')" id="shape-free" class="active">Free</button>
            <button onclick="setShape('line')" id="shape-line">Line</button>
            <button onclick="setShape('rect')" id="shape-rect">Rect</button>
            <button onclick="setShape('circle')" id="shape-circle">Circle</button>
            <button onclick="setShape('arrow')" id="shape-arrow">Arrow</button>
        </div>

        <!-- Row 3: Slides & Media -->
        <div class="menu-row">
            <button onclick="prevSlide()">◀</button>
            <span id="slide-indicator" style="font-size: 11px; color: #aaa;">1/1</span>
            <button onclick="nextSlide()">▶</button>
            <button onclick="addSlide()">+ Slide</button>
            <label for="pdf-upload">📄 PDF</label>
            <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" onchange="handlePDF(event)">
            <button id="btn-cam" onclick="toggleWebcam()">📹 Cam</button>
        </div>

        <!-- Row 4: 3D Objects & Controls -->
        <div class="menu-row">
            <span style="color:#aaa; font-size:11px;">3D:</span>
            <button onclick="spawn3D('cube')">Cube</button>
            <button onclick="spawn3D('sphere')">Sphere</button>
            <button onclick="spawn3D('cylinder')">Cyl</button>
            <button id="btn-trans" onclick="toggleTransparency()">Trans</button>
            <button id="btn-rot" class="active" onclick="toggleRotation()">Rot</button>
            <button onclick="clear3D()" style="background: #c9302c;">Clear 3D</button>
        </div>

        <!-- Row 5: Background & Save -->
        <div class="menu-row">
            <select id="bg-selector" onchange="changeBackground(this.value)">
                <option value="green">Chalkboard</option>
                <option value="dark">Dark BG</option>
                <option value="white">White BG</option>
                <option value="grid">Grid / Graph</option>
            </select>
            <button onclick="saveCanvas()" style="background: #5cb85c;">💾 Save Notes</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const laserCanvas = document.getElementById('laser-canvas');
        const laserCtx = laserCanvas.getContext('2d');
        const container = document.getElementById('board-container');
        const toolbar = document.getElementById('toolbar');
        const moreMenu = document.getElementById('more-menu');
        const canvas3D = document.getElementById('canvas-3d');

        let painting = false;
        let mode = 'pen'; 
        let interactionMode = 'draw';
        let currentColor = '#00adb5'; 
        let currentSize = 5;
        let currentShape = 'free';
        let startX, startY, snapshot;
        
        let undoStack = [];
        let redoStack = [];
        let laserPoints = [];

        function toggleMoreMenu() {
            if (moreMenu.style.display === 'flex') {
                moreMenu.style.display = 'none';
            } else {
                moreMenu.style.display = 'flex';
            }
        }

        function setInteraction(type) {
            interactionMode = type;
            if (type === 'draw') {
                document.getElementById('mode-draw').classList.add('active');
                document.getElementById('mode-3d').classList.remove('active');
                canvas3D.classList.remove('interactive');
                if (canvas) canvas.style.pointerEvents = 'auto';
            } else {
                document.getElementById('mode-3d').classList.add('active');
                document.getElementById('mode-draw').classList.remove('active');
                canvas3D.classList.add('interactive');
                if (canvas) canvas.style.pointerEvents = 'none';
            }
        }

        function saveState() {
            if (canvas.width > 0 && canvas.height > 0) {
                undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                redoStack = [];
            }
        }

        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            if(canvas.width > 0 && canvas.height > 0) tempCtx.drawImage(canvas, 0, 0);

            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            laserCanvas.width = window.innerWidth; laserCanvas.height = window.innerHeight;
            if(tempCanvas.width > 0 && tempCanvas.height > 0) ctx.drawImage(tempCanvas, 0, 0);

            if (window.renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isDragging = false;
        let offsetX, offsetY;
        toolbar.addEventListener('mousedown', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            isDragging = true;
            offsetX = e.clientX - toolbar.offsetLeft;
            offsetY = e.clientY - toolbar.offsetTop;
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', (e) => {
            if(!isDragging) return;
            toolbar.style.left = (e.clientX - offsetX) + 'px';
            toolbar.style.top = (e.clientY - offsetY) + 'px';
            toolbar.style.transform = 'none';
        });
        document.addEventListener('mouseup', () => { isDragging = false; document.body.style.userSelect = 'auto'; });

        toolbar.addEventListener('touchstart', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
            isDragging = true;
            offsetX = e.touches[0].clientX - toolbar.offsetLeft;
            offsetY = e.touches[0].clientY - toolbar.offsetTop;
        }, {passive: false});
        document.addEventListener('touchmove', (e) => {
            if(!isDragging) return;
            toolbar.style.left = (e.touches[0].clientX - offsetX) + 'px';
            toolbar.style.top = (e.touches[0].clientY - offsetY) + 'px';
            toolbar.style.transform = 'none';
        }, {passive: false});
        document.addEventListener('touchend', () => { isDragging = false; });

        function setMode(newMode) {
            setInteraction('draw');
            mode = newMode;
            document.querySelectorAll('#toolbar button, #more-menu button').forEach(b => {
                if(b.id && (b.id.startsWith('btn-pen') || b.id.startsWith('btn-highlighter') || b.id.startsWith('btn-eraser') || b.id.startsWith('btn-laser'))) b.classList.remove('active');
            });
            if(mode === 'pen') document.getElementById('btn-pen').classList.add('active');
            if(mode === 'highlighter') document.getElementById('btn-highlighter').classList.add('active');
            if(mode === 'eraser') document.getElementById('btn-eraser').classList.add('active');
            if(mode === 'laser') document.getElementById('btn-laser').classList.add('active');
        }

        function setBrushSize(size) {
            currentSize = parseInt(size);
            document.getElementById('size-val').innerText = size;
        }

        function setColor(hexColor) { 
            currentColor = hexColor; 
            if (currentMesh && currentMesh.material) {
                currentMesh.material.color.set(new THREE.Color(hexColor));
            }
        }

        function setShape(shape) {
            setInteraction('draw');
            currentShape = shape;
            document.querySelectorAll('#more-menu button').forEach(b => {
                if(b.id && b.id.startsWith('shape-')) b.classList.remove('active');
            });
            const selectedBtn = document.getElementById('shape-' + shape);
            if(selectedBtn) selectedBtn.classList.add('active');
        }

        function changeBackground(val) {
            if (val === 'dark') { container.style.background = '#111'; container.style.backgroundImage = 'none'; }
            else if (val === 'white') { container.style.background = '#ffffff'; container.style.backgroundImage = 'none'; }
            else if (val === 'green') { container.style.background = '#0f381e'; container.style.backgroundImage = 'none'; }
            else if (val === 'grid') {
                container.style.background = '#111';
                container.style.backgroundImage = 'linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px)';
                container.style.backgroundSize = '20px 20px';
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startPosition(e) {
            if (interactionMode !== 'draw') return;
            painting = true;
            if (mode !== 'laser') saveState();
            const pos = getMousePos(e);
            startX = pos.x; startY = pos.y;
            if (mode !== 'laser') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            }
        }

        function finishedPosition() {
            if (!painting) return;
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting || interactionMode !== 'draw') return;
            e.preventDefault();
            const pos = getMousePos(e);

            if (mode === 'laser') {
                laserPoints.push({ x: pos.x, y: pos.y, time: Date.now() });
                return;
            }

            if (currentShape !== 'free' && mode !== 'eraser') {
                ctx.putImageData(snapshot, 0, 0);
                drawShape(pos.x, pos.y);
                return;
            }

            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (mode === 'eraser') {
                ctx.strokeStyle = container.style.background.includes('rgb(255, 255, 255)') || container.style.background === '#ffffff' ? '#ffffff' : '#111';
                ctx.globalAlpha = 1.0;
                ctx.lineWidth = currentSize * 3;
            } else if (mode === 'highlighter') {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 0.3;
            } else {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 1.0;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function drawShape(x, y) {
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.globalAlpha = (mode === 'highlighter') ? 0.3 : 1.0;

            if (currentShape === 'line') {
                ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke();
            } else if (currentShape === 'rect') {
                ctx.strokeRect(startX, startY, x - startX, y - startY);
            } else if (currentShape === 'circle') {
                let radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                ctx.beginPath(); ctx.arc(startX, startY, radius, 0, 2 * Math.PI); ctx.stroke();
            } else if (currentShape === 'arrow') {
                drawArrow(startX, startY, x, y);
            }
        }

        function drawArrow(fromx, fromy, tox, toy) {
            const headlen = 10;
            const dx = tox - fromx; const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.moveTo(fromx, fromy); ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        function renderLaser() {
            laserCtx.clearRect(0, 0, laserCanvas.width, laserCanvas.height);
            if (mode === 'laser') {
                const now = Date.now();
                laserPoints = laserPoints.filter(p => now - p.time < 500);

                laserPoints.forEach((p) => {
                    const age = now - p.time;
                    const life = 1 - age / 500;

                    laserCtx.save();
                    laserCtx.beginPath();
                    laserCtx.arc(p.x, p.y, currentSize * 2, 0, 2 * Math.PI);
                    laserCtx.fillStyle = currentColor;
                    laserCtx.globalAlpha = Math.max(0, life);
                    
                    if (Math.floor(age / 100) % 2 === 0) {
                        laserCtx.shadowBlur = 15;
                        laserCtx.shadowColor = currentColor;
                        laserCtx.fill();
                    }
                    laserCtx.restore();
                });
            }
            requestAnimationFrame(renderLaser);
        }
        renderLaser();

        function undoCanvas() {
            if (undoStack.length > 0) {
                redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            }
        }

        function redoCanvas() {
            if (redoStack.length > 0) {
                undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let nextState = redoStack.pop();
                ctx.putImageData(nextState, 0, 0);
            }
        }

        function clearCanvas() { saveState(); ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function saveCanvas() {
            const link = document.createElement('a');
            link.download = 'sks-board-notes.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        let currentSlideNum = 1;
        function nextSlide() { currentSlideNum++; document.getElementById('slide-indicator').innerText = currentSlideNum + '/1'; clearCanvas(); }
        function prevSlide() { if(currentSlideNum > 1) currentSlideNum--; document.getElementById('slide-indicator').innerText = currentSlideNum + '/1'; }
        function addSlide() { nextSlide(); }

        function handlePDF(event) { alert('PDF Uploaded successfully!'); }

        let webcamActive = false;
        function toggleWebcam() {
            const box = document.getElementById('webcam-container');
            const video = document.getElementById('webcam-video');
            if (!webcamActive) {
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream; box.style.display = 'block'; webcamActive = true;
                    document.getElementById('btn-cam').classList.add('active');
                }).catch(err => alert('Webcam permission denied.'));
            } else {
                let stream = video.srcObject;
                if(stream) stream.getTracks().forEach(track => track.stop());
                box.style.display = 'none';
                webcamActive = false;
                document.getElementById('btn-cam').classList.remove('active');
            }
        }

        container.addEventListener('mousedown', startPosition);
        container.addEventListener('mouseup', finishedPosition);
        container.addEventListener('mousemove', draw);
        container.addEventListener('touchstart', startPosition, { passive: false });
        container.addEventListener('touchend', finishedPosition);
        container.addEventListener('touchmove', draw, { passive: false });

        var renderer, camera;
        let scene, currentMesh, controls;
        let rotate3D = true;
        let isTransparent = false;

        function init3D() {
            if (renderer) return;
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const canvas3DElement = document.getElementById('canvas-3d');
            renderer = new THREE.WebGLRenderer({ canvas: canvas3DElement, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            window.renderer = renderer;

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            camera.position.z = 5;
            animate3D();
        }

        function createMeshGeometry(type) {
            if (type === 'cube') return new THREE.BoxGeometry(2, 2, 2);
            if (type === 'sphere') return new THREE.SphereGeometry(1.5, 32, 32);
            if (type === 'cylinder') return new THREE.CylinderGeometry(1, 1, 3, 32);
            return new THREE.BoxGeometry(2, 2, 2);
        }

        function createMeshMaterial(colorHex) {
            return new THREE.MeshLambertMaterial({ 
                color: new THREE.Color(colorHex), 
                wireframe: false,
                transparent: isTransparent,
                opacity: isTransparent ? 0.6 : 1.0
            });
        }

        function spawn3D(type) {
            setInteraction('3d');
            
            if (scene && currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
                currentMesh = null;
            }

            const geometry = createMeshGeometry(type);
            const material = createMeshMaterial(currentColor);
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
            
            if (controls) controls.reset();
            if (moreMenu) moreMenu.style.display = 'none';
        }

        function toggleTransparency() {
            isTransparent = !isTransparent;
            const btn = document.getElementById('btn-trans');
            if(btn) btn.classList.toggle('active');
            if (currentMesh) {
                currentMesh.material.transparent = isTransparent;
                currentMesh.material.opacity = isTransparent ? 0.6 : 1.0;
                currentMesh.material.needsUpdate = true;
            }
        }

        function toggleRotation() {
            rotate3D = !rotate3D;
            const btn = document.getElementById('btn-rot');
            if(btn) btn.classList.toggle('active');
        }

        function clear3D() { 
            if (scene && currentMesh) { 
                scene.remove(currentMesh); 
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
                currentMesh = null; 
            } 
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (currentMesh && rotate3D) { 
                currentMesh.rotation.x += 0.01; 
                currentMesh.rotation.y += 0.015; 
            }
            if (controls) controls.update();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Initialize 3D immediately when script runs
        init3D();
    </script>
</body>
</html>
