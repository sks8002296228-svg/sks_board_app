<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Board - Ultimate Teaching App</title>
    <!-- Three.js for 3D Shapes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #board-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #111;
            cursor: crosshair;
        }

        /* Background styles */
        .bg-dark { background: #111; }
        .bg-white { background: #ffffff; }
        .bg-green { background: #0f381e; }
        .bg-grid {
            background-color: #111;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .bg-lined {
            background-color: #111;
            background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 100% 30px;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
        }

        #canvas-3d { pointer-events: none; z-index: 10; }
        #whiteboard { z-index: 5; }

        /* Webcam Floating Box */
        #webcam-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #000;
            border: 2px solid #00adb5;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            z-index: 200;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #webcam-video { width: 100%; height: 100%; object-fit: cover; }

        /* Toolbar UI */
        #toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            z-index: 300;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 98vw;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 5px;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 8px;
        }

        button, select, label {
            background: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        button:hover, select:hover, label:hover { background: #3a3a3a; }
        button.active { background: #00adb5; border-color: #00adb5; font-weight: bold; }

        .preset-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="board-container" class="bg-dark">
        <canvas id="whiteboard"></canvas>
        <canvas id="canvas-3d"></canvas>
    </div>

    <!-- Webcam View -->
    <div id="webcam-container">
        <video id="webcam-video" autoplay playsinline></video>
    </div>

    <!-- Toolbar -->
    <div id="toolbar">
        <!-- Tools Mode -->
        <div class="tool-group">
            <button id="btn-pen" class="active" onclick="setMode('pen')">🖊️ Pen</button>
            <button id="btn-highlighter" onclick="setMode('highlighter')">🖍️ High</button>
            <button id="btn-eraser" onclick="setMode('eraser')">🧹 Erase</button>
        </div>

        <!-- Colors -->
        <div class="tool-group">
            <div class="preset-color" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
            <div class="preset-color" style="background: #00adb5;" onclick="setColor('#00adb5')"></div>
            <div class="preset-color" style="background: #ff5722;" onclick="setColor('#ff5722')"></div>
            <div class="preset-color" style="background: #ffeb3b;" onclick="setColor('#ffeb3b')"></div>
            <div class="preset-color" style="background: #4caf50;" onclick="setColor('#4caf50')"></div>
        </div>

        <!-- Undo / Redo / Trash -->
        <div class="tool-group">
            <button onclick="undoCanvas()" title="Undo">↩️</button>
            <button onclick="redoCanvas()" title="Redo">↪️</button>
            <button onclick="clearCanvas()" style="background: #d9534f;" title="Trash / Clear">🗑️</button>
        </div>

        <!-- Slide Navigation -->
        <div class="tool-group">
            <button onclick="prevSlide()">◀</button>
            <span id="slide-indicator" style="font-size: 12px; color: #aaa;">1/1</span>
            <button onclick="nextSlide()">▶</button>
            <button onclick="addSlide()">+ Slide</button>
        </div>

        <!-- PDF & Webcam & Save -->
        <div class="tool-group">
            <label for="pdf-upload">📄 PDF</label>
            <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" onchange="handlePDF(event)">
            
            <button id="btn-cam" onclick="toggleWebcam()">📹 Cam</button>
        </div>

        <!-- 3D Shapes -->
        <div class="tool-group">
            <button onclick="spawn3D('cube')">🧊 Cube</button>
            <button onclick="spawn3D('sphere')">⚽ Sphere</button>
            <button onclick="spawn3D('cylinder')">🥫 Cyl</button>
            <button onclick="clear3D()" style="background: #c9302c;">Clear 3D</button>
        </div>

        <!-- Backgrounds -->
        <div class="tool-group">
            <select id="bg-selector" onchange="changeBackground(this.value)">
                <option value="bg-dark">Dark</option>
                <option value="bg-white">White</option>
                <option value="bg-green">Chalk</option>
                <option value="bg-grid">Grid</option>
                <option value="bg-lined">Lined</option>
            </select>
        </div>

        <!-- Save Action -->
        <div class="tool-group" style="border: none;">
            <button onclick="saveCanvas()" style="background: #5cb85c;">💾 Save</button>
        </div>
    </div>

    <script>
        // --- WHITEBOARD & UNDO/REDO LOGIC ---
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('board-container');

        let painting = false;
        let mode = 'pen'; 
        let currentColor = '#ffffff';
        let currentSize = 3;
        let startX, startY;
        
        let undoStack = [];
        let redoStack = [];

        function saveState() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = []; // Clear redo on new action
        }

        function resizeCanvas() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.putImageData(imgData, 0, 0);

            if (renderer) {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('#toolbar button').forEach(b => {
                if(b.id.startsWith('btn-')) b.classList.remove('active');
            });
            document.getElementById('btn-' + mode).classList.add('active');
            
            if(mode === 'highlighter') currentSize = 20;
            else if(mode === 'pen') currentSize = 3;
            else if(mode === 'eraser') currentSize = 25;
        }

        function setColor(color) { currentColor = color; }

        function changeBackground(bgClass) {
            container.className = '';
            container.classList.add(bgClass);
        }

        function startPosition(e) {
            if (e.target.id === 'canvas-3d') return;
            painting = true;
            saveState();
            const rect = canvas.getBoundingClientRect();
            startX = (e.clientX || e.touches[0].clientX) - rect.left;
            startY = (e.clientY || e.touches[0].clientY) - rect.top;
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
        }

        function finishedPosition() {
            if (!painting) return;
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (mode === 'eraser') {
                ctx.strokeStyle = container.classList.contains('bg-white') ? '#ffffff' : (container.classList.contains('bg-green') ? '#0f381e' : '#111111');
                ctx.globalAlpha = 1.0;
            } else if (mode === 'highlighter') {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 0.3;
            } else {
                ctx.strokeStyle = currentColor;
                ctx.globalAlpha = 1.0;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function undoCanvas() {
            if (undoStack.length > 0) {
                redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            }
        }

        function redoCanvas() {
            if (redoStack.length > 0) {
                undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
                let nextState = redoStack.pop();
                ctx.putImageData(nextState, 0, 0);
            }
        }

        function clearCanvas() {
            saveState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveCanvas() {
            const link = document.createElement('a');
            link.download = 'sks-board-notes.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Slide placeholder functions
        let currentSlideNum = 1;
        function nextSlide() { currentSlideNum++; document.getElementById('slide-indicator').innerText = currentSlideNum + '/1'; clearCanvas(); }
        function prevSlide() { if(currentSlideNum > 1) currentSlideNum--; document.getElementById('slide-indicator').innerText = currentSlideNum + '/1'; }
        function addSlide() { nextSlide(); }

        // PDF Handler placeholder
        function handlePDF(event) {
            alert('PDF Uploaded! (Feature ready for rendering pages)');
        }

        // Webcam Toggle
        let webcamActive = false;
        function toggleWebcam() {
            const box = document.getElementById('webcam-container');
            const video = document.getElementById('webcam-video');
            if (!webcamActive) {
                navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    box.style.display = 'block';
                    webcamActive = true;
                    document.getElementById('btn-cam').classList.add('active');
                }).catch(err => alert('Webcam permission denied or unavailable.'));
            } else {
                let stream = video.srcObject;
                if(stream) stream.getTracks().forEach(track => track.stop());
                box.style.display = 'none';
                webcamActive = false;
                document.getElementById('btn-cam').classList.remove('active');
            }
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);


        // --- 3D THREE.JS LOGIC ---
        let scene, camera, renderer, currentMesh;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas-3d'), alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            camera.position.z = 5;
            animate3D();
        }

        function spawn3D(type) {
            if (currentMesh) scene.remove(currentMesh);
            let geometry;
            if (type === 'cube') geometry = new THREE.BoxGeometry(2, 2, 2);
            else if (type === 'sphere') geometry = new THREE.SphereGeometry(1.5, 32, 32);
            else if (type === 'cylinder') geometry = new THREE.CylinderGeometry(1, 1, 3, 32);

            const material = new THREE.MeshStandardMaterial({ color: 0x00adb5, roughness: 0.3, metalness: 0.2 });
            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        function clear3D() {
            if (currentMesh) { scene.remove(currentMesh); currentMesh = null; }
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (currentMesh) { currentMesh.rotation.x += 0.01; currentMesh.rotation.y += 0.015; }
            renderer.render(scene, camera);
        }

        init3D();
    </script>
</body>
</html>
